name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Git Semantic Version
      uses: PaulHatch/semantic-version@v6.0.2
      with:
        major_pattern: "major:"
        minor_pattern: "feat:"
        version_format: "${major}.${minor}.${patch}-prerelease${increment}"
      id: version

    - name: Docker login
      env:
        DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        
      run: 
        docker login -u $DOCKER_HUB_USERNAME -p $DOCKER_HUB_PASSWORD
        
    - name: Build Docker Image
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: 
        docker build -t adriayc/docker-graphql-actions:$VERSION .
        docker build -t adriayc/docker-graphql-actions:latest .

    - name: Push Docker Image
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: 
        docker push adriayc/docker-graphql-actions:$VERSION
        docker push adriayc/docker-graphql-actions:latest
    
    # - name: Build the Docker image
    #   run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
